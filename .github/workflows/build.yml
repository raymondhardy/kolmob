name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The KoLmafia core is not committed: fetch the exact upstream commit this was built against.
      - name: Fetch KoLmafia upstream
        run: |
          SHA=$(sed -E 's/^upstream commit: *//' kolmafia-core/UPSTREAM_VERSION | tr -d '[:space:]')
          git clone --filter=blob:none https://github.com/kolmafia/kolmafia.git "$RUNNER_TEMP/kolmafia"
          git -C "$RUNNER_TEMP/kolmafia" checkout "$SHA"
          tools/sync-upstream.sh "$RUNNER_TEMP/kolmafia"

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Optional release signing: add these four repository secrets to get a signed release APK.
      - name: Release signing config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Signing the release APK."
          else
            echo "No signing secrets: the release APK will be unsigned."
          fi

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kolmob-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "Kolmob $GITHUB_REF_NAME" \
            $(find app/build/outputs/apk/release -name '*.apk')
